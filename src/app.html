<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- With scripts the server's text stays hidden: the paper and the bar, then the app,
		     not a page that is shown and then replaced (Thijs, 10 Oct: "erg afleidend"). If
		     the app has not mounted after 4 s (a chunk that fails), the text shows after all;
		     the root layout stops the timer. Without scripts, and for a crawler, it is there. -->
		<script>
			document.documentElement.classList.add('js');
			window.__seoTerug = setTimeout(function () {
				document.documentElement.classList.remove('js');
			}, 4000);
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta
			data-seo
			name="description"
			content="Concordans: wetten, uitspraken en Kamerstukken uit officiële bronnen, met hun onderlinge verbindingen."
		/>
		<meta property="og:site_name" content="Concordans" />
		<meta property="og:type" content="website" />
		<!-- The content the server puts in main#seo for a readable address, readable
		     before the app starts; the root layout removes it as the app mounts. Set as the
		     app sets a page, so the step to the app is barely seen: the paper, the serif, the
		     sizes of a reader, a bar where the top bar comes, the frame of .blad. The app's
		     stylesheet arrives with its scripts, so the tokens it needs are here, with the
		     values of lib/styles (a test keeps them equal). -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Newsreader-Variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<style>
			@font-face {
				font-family: 'Newsreader Fallback';
				src: local('Georgia');
				font-weight: 400 500;
				font-style: normal;
				size-adjust: 94%;
				ascent-override: 79%;
				descent-override: 28%;
				line-gap-override: 0%;
			}
			@font-face {
				font-family: 'Newsreader Fallback';
				src: local('Georgia Bold'), local('Georgia-Bold');
				font-weight: 600 800;
				font-style: normal;
				size-adjust: 83%;
				ascent-override: 89%;
				descent-override: 31%;
				line-gap-override: 0%;
			}
			@font-face {
				font-family: 'Newsreader Fallback Noto';
				src: local('Noto Serif'), local('NotoSerif-Regular');
				font-weight: 400 500;
				font-style: normal;
				size-adjust: 88%;
				ascent-override: 84%;
				descent-override: 30%;
				line-gap-override: 0%;
			}
			@font-face {
				font-family: 'Newsreader Fallback Noto';
				src: local('Noto Serif Bold'), local('NotoSerif-Bold');
				font-weight: 600 800;
				font-style: normal;
				size-adjust: 85%;
				ascent-override: 87%;
				descent-override: 31%;
				line-gap-override: 0%;
			}
			@font-face {
				font-family: 'Newsreader Fallback DejaVu';
				src: local('DejaVu Serif'), local('DejaVuSerif');
				font-weight: 400 500;
				font-style: normal;
				size-adjust: 81%;
				ascent-override: 91%;
				descent-override: 32%;
				line-gap-override: 0%;
			}
			@font-face {
				font-family: 'Newsreader Fallback DejaVu';
				src: local('DejaVu Serif Bold'), local('DejaVuSerif-Bold');
				font-weight: 600 800;
				font-style: normal;
				size-adjust: 76%;
				ascent-override: 97%;
				descent-override: 34%;
				line-gap-override: 0%;
			}
			@font-face {
				font-family: 'Newsreader';
				src: url('/fonts/Newsreader-Variable.woff2') format('woff2');
				font-weight: 400 600;
				font-style: normal;
				font-display: swap;
				unicode-range:
					U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
					U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			:root:has(#seo) {
				--paper: #faf8f3;
				--rule: #b9b1a0;
				--ink: #161513;
				--ink-2: #3b3834;
				--ink-3: #5d5951;
				--font-serif:
					'Newsreader', 'Newsreader Fallback', 'Newsreader Fallback Noto',
					'Newsreader Fallback DejaVu', Georgia, serif;
				--t-h1: 30px;
				--t-h3: 20px;
				--t-body: 17.5px;
				--t-meta: 14px;
				--lh-tight: 1.15;
				--lh-body: 1.6;
				--s-2: 8px;
				--s-4: 16px;
				--s-5: 24px;
				--s-6: 32px;
				--s-8: 64px;
				--topbar-h: 60px;
				--blad-max: 1440px;
				--blad-tekst: 720px;
				background: var(--paper);
			}
			body:has(#seo) {
				margin: 0;
				background: var(--paper);
				color: var(--ink);
				font-family: var(--font-serif);
				font-optical-sizing: auto;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}
			/* Where the top bar comes: its height and its rule. */
			body:has(#seo)::before {
				content: '';
				display: block;
				height: var(--topbar-h);
				border-bottom: 1px solid var(--rule);
			}
			.js #seo {
				display: none;
			}
			/* .blad with a reading width (.blad--tekst). */
			#seo {
				box-sizing: border-box;
				max-width: var(--blad-max);
				margin: 0 auto;
				padding: var(--s-6) var(--s-6) var(--s-8);
				font-size: var(--t-body);
				line-height: var(--lh-body);
				overflow-wrap: anywhere;
			}
			#seo > * {
				max-width: var(--blad-tekst);
			}
			#seo h1 {
				margin: 0 0 var(--s-2);
				font-size: var(--t-h1);
				font-weight: 600;
				line-height: var(--lh-tight);
			}
			#seo h2 {
				margin: var(--s-5) 0 var(--s-2);
				font-size: var(--t-h3);
				font-weight: 600;
				line-height: var(--lh-tight);
			}
			#seo p {
				margin: 0 0 var(--s-2);
			}
			/* The line under the title (the law, a date) as a reader's meta line. */
			#seo h1 + p {
				margin-bottom: var(--s-5);
				font-size: var(--t-meta);
				color: var(--ink-2);
			}
			#seo ul,
			#seo ol {
				margin: 0;
				padding: 0;
				list-style: none;
			}
			#seo li {
				padding: 2px 0;
			}
			#seo a {
				color: inherit;
				text-decoration: none;
			}
			@media (max-width: 768px) {
				#seo {
					padding: var(--s-4) var(--s-4) var(--s-8);
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
