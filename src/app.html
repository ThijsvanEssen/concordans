<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta
			data-seo
			name="description"
			content="Concordans: wetten, uitspraken en Kamerstukken uit officiële bronnen, met hun onderlinge verbindingen."
		/>
		<meta property="og:site_name" content="Concordans" />
		<meta property="og:type" content="website" />
		<!-- The content the server puts in <main id="seo"> for a readable address, readable
		     before the app starts; the root layout removes it as the app mounts. -->
		<style>
			#seo {
				box-sizing: border-box;
				max-width: 42rem;
				margin: 0 auto;
				padding: 32px 16px;
				font-family: 'Newsreader', Georgia, serif;
				font-size: 18px;
				line-height: 1.55;
				color: #161513;
				background: #faf8f3;
				overflow-wrap: anywhere;
			}
			#seo a {
				color: inherit;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
