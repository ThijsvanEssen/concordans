# A push to `release` puts that commit on the server: lint, check and tests first, then a static
# build that is copied into a directory of its own on the server, after which `current` points
# at it. The reverse proxy serves `current`; the five newest builds stay, so going back is one
# `ln -sfn`. `immutable` holds the _app/immutable files of all five: a tab opened before a deploy
# still finds its chunks there (Caddy serves /_app/immutable/* from it, a 404 when none has it).
#
# Repository settings (Settings → Secrets and variables → Actions):
#   variable CONCORDANS_API_BASE_URL  the address of the API the build talks to
#   secret   DEPLOY_SSH_KEY           the private key whose public half is on the server
#   secret   DEPLOY_HOST              the address of the server
#   secret   DEPLOY_KNOWN_HOSTS       the known_hosts line of the server's host key, taken on the
#                                     server itself; a changed key stops the deploy
#   secret   DEPLOY_USER              the user that owns DEPLOY_DIR
name: deploy

on:
  push:
    branches: [release]

# one deploy at a time; a second push waits for the first instead of cancelling it halfway
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /srv/lawgraph/concordans

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

      - name: Build
        run: npm run build
        env:
          PUBLIC_CONCORDANS_API_BASE_URL: ${{ vars.CONCORDANS_API_BASE_URL }}

      - name: SSH key and host key
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Copy and switch
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30"
          RELEASE="$DEPLOY_DIR/releases/$GITHUB_SHA"
          rsync -az --delete --chmod=Do+rx,Fo+r -e "$SSH" build/ "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE/"
          # immutable/ is the union of _app/immutable of the kept builds: filled before the switch
          # (the new chunks are there before current points at them), pruned after old builds go
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "D='$DEPLOY_DIR' RELEASE='$RELEASE' sh -s" << 'EOF'
          set -e
          sync_immutable() {
            set --
            for r in "$D"/releases/*/; do
              [ -d "${r}_app/immutable" ] && set -- "$@" "${r}_app/immutable/"
            done
            mkdir -p "$D/immutable"
            rsync -a --delete --chmod=Do+rx,Fo+r "$@" "$D/immutable/"
          }
          sync_immutable
          ln -sfn "$RELEASE" "$D/current"
          ls -1dt "$D"/releases/*/ | tail -n +6 | xargs -r rm -rf
          sync_immutable
          EOF
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
