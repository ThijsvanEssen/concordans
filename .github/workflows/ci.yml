# Every pull request and every push to main runs the checks. The deploy of a commit waits for
# a green run of this workflow on it (deploy.yml) and runs none of them again.
# Lint is prettier --check over the whole repository (Markdown included) and ESLint.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# a newer push to the same branch or pull request makes the older run moot
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The types are made from the schema in the repository (npm run sync:api dumps it from
      # lawgraph): types that differ from it were edited by hand or not made again.
      - name: Types from openapi.json
        run: npm run types:api && git diff --exit-code -- src/lib/api/generated
      - name: Lint (prettier --check, eslint)
        run: npm run lint
      - name: Type check (svelte-check)
        run: npm run check
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
